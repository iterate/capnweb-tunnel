name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11
      - run: corepack enable
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      # Example tests need the pinned Bun/Deno versions above; local runs skip them.
      - run: pnpm test:examples
      - run: pnpm lint
      - name: arethetypeswrong
        run: |
          pnpm pack
          mv $(ls | grep .tgz) pkg-ignoreme.tgz
          npx --yes --package @arethetypeswrong/cli@0.18.2 --package fflate@0.8.2 attw pkg-ignoreme.tgz --profile esm-only
