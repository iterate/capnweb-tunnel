name: CI

on:
  push: {}
  pull_request: {}

jobs:
  build-test-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g corepack@0.31.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: mkdir -p .pkg
      - run: pnpm pack --pack-destination .pkg --json
      - run: pnpm exec attw .pkg/*.tgz --profile esm-only
